version: 2

models:
  - name: stg_competitions
    columns:
      - name: competition_id
        data_tests:
          - unique
          - not_null

      - name: competition_name
        data_tests:
          - not_null
      
      - name: competition_code
        data_tests:
            - not_null
            - unique

      - name: competition_type
        data_tests:
            - not_null