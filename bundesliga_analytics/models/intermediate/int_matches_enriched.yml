version: 2

models: 
    - name: int_matches_enriched
      columns:
        - name: match_id
          data_tests: 
            - unique
            - not_null
        
        - name: home_team_name
          data_tests:
            - not_null
        - name: away_team_name
          data_tests:
            - not_null
        - name: competition_name
          data_tests:
            - accepted_values: 
                arguments: 
                    values: ['Bundesliga']
        - name: season_id
          data_tests:
            - not_null